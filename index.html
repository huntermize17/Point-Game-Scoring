<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Point Game Scoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ef; --panel:#ffffff; --panel2:#f8f5f1; --ink:#2a1215; --muted:#76605d;
  --line:#e3d8d3; --field:#b3122a; --bulb:#c5b358; --bulb-ink:#2a2200; --bad:#8f0f22; --good:#b3122a;
  --btn:#efe8e3; --btn-ink:#2a1215; --pen:#3d3033;
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --ui:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b0a0d; --panel:#2a1115; --panel2:#220c10; --ink:#f5efe6; --muted:#c7aca7;
    --line:#4a1d23; --field:#c8102e; --bulb:#c5b358; --bulb-ink:#231c00; --bad:#ff8a93; --good:#d8c878;
    --btn:#3b171c; --btn-ink:#f5efe6; --pen:#5b4b4e;
  }
}
:root[data-theme="dark"]{
  --bg:#1b0a0d; --panel:#2a1115; --panel2:#220c10; --ink:#f5efe6; --muted:#c7aca7;
    --line:#4a1d23; --field:#c8102e; --bulb:#c5b358; --bulb-ink:#231c00; --bad:#ff8a93; --good:#d8c878;
    --btn:#3b171c; --btn-ink:#f5efe6; --pen:#5b4b4e;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--bulb);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 48px}

/* Header */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-family:var(--display);font-weight:900;font-size:clamp(2.4rem,8vw,3.6rem);line-height:.9;margin:0;letter-spacing:.01em}
.head-actions{display:flex;gap:8px}
.ghost{padding:9px 14px;border-radius:8px;background:var(--btn);color:var(--btn-ink);font-weight:600;font-size:.95rem}
.ghost[aria-disabled="true"]{opacity:.4;pointer-events:none}

/* Round selector */
.rounds{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:16px}
.rbtn{padding:10px 0 8px;border-radius:8px;background:var(--panel);border:2px solid var(--line);text-align:center}
.rbtn b{display:block;font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1}
.rbtn span{font-size:.72rem;color:var(--muted)}
.rbtn[aria-pressed="true"]{background:var(--field);border-color:var(--field);color:#fff}
.rbtn[aria-pressed="true"] span{color:#f7d9dd}

/* Situation board */
.situation{display:flex;align-items:center;gap:18px;background:var(--field);color:#fff;border-radius:14px;padding:14px 18px;margin-bottom:16px}
.situation svg{flex:0 0 auto;width:96px;height:96px}
.sit-text .rn{font-family:var(--display);font-weight:800;font-size:1.1rem;opacity:.8}
.sit-text .desc{font-family:var(--display);font-weight:900;font-size:clamp(1.7rem,6vw,2.4rem);line-height:1}
.sit-text .outs{margin-top:6px;display:flex;gap:6px;align-items:center;font-weight:600}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff}
.dot.on{background:var(--bulb);border-color:var(--bulb)}
.base{fill:rgba(255,255,255,.18);stroke:#fff;stroke-width:2}
.base.on{fill:var(--bulb);stroke:var(--bulb)}

/* Team cards */
.teams{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:720px){.teams{grid-template-columns:1fr 1fr}}
.team{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.team-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.tname{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1}
.gtot{font-size:.85rem;color:var(--muted);margin-top:4px}
.gtot .lead{color:var(--good);font-weight:700}
.rtot{min-width:84px;text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px 10px 6px}
.rtot b{display:block;font-family:var(--display);font-weight:900;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.rtot span{font-size:.72rem;color:var(--muted)}
.rtot b.neg{color:var(--bad)}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row .lbl{font-weight:600}
.row .sub{display:block;font-size:.78rem;color:var(--muted);font-weight:500}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:46px;height:46px;border-radius:10px;background:var(--btn);color:var(--btn-ink);font-size:1.5rem;font-weight:700;line-height:1}
.stepper button.plus{background:var(--field);color:#fff}
.stepper button.minus5{background:var(--pen);color:#fff}
.stepper output{min-width:40px;text-align:center;font-family:var(--display);font-weight:800;font-size:1.7rem;font-variant-numeric:tabular-nums}
.velo{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.velo button{flex:1 1 0;min-width:74px;padding:8px 4px;border-radius:10px;background:var(--bulb);color:var(--bulb-ink);font-weight:700;line-height:1.1}
.velo button small{display:block;font-weight:600;font-size:.75rem;opacity:.8}

/* Standings */
h2{font-family:var(--display);font-weight:800;font-size:1.9rem;margin:28px 0 8px}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:520px;font-variant-numeric:tabular-nums}
th,td{padding:10px 10px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:.8rem;color:var(--muted);font-weight:600}
td:first-child,th:first-child{text-align:left}
tr:last-child td{border-bottom:0}
td.cur,th.cur{background:var(--panel2)}
td.tot{font-family:var(--display);font-weight:900;font-size:1.5rem}
tr.leader td.tot{color:var(--good)}
.rank{display:inline-block;width:1.4em;color:var(--muted);font-weight:600}

/* Rules + setup */
details{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
summary{cursor:pointer;font-weight:700;padding:10px 0}
details ul{margin:0 0 12px;padding-left:1.2em}
details li{margin:4px 0}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
textarea{min-height:80px;resize:vertical;margin-bottom:12px}
.danger{padding:10px 14px;border-radius:8px;background:transparent;border:2px solid var(--bad);color:var(--bad);font-weight:700;margin-bottom:14px}
label.sm{font-size:.8rem;color:var(--muted);display:block;margin-bottom:4px}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.bump{animation:bump .25s ease-out}
@keyframes bump{0%{transform:scale(1.18)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.bump{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Point Game</h1>
    <div class="head-actions">
      <button class="ghost" id="undo" aria-disabled="true">Undo</button>
    </div>
  </header>

  <nav class="rounds" id="rounds" aria-label="Rounds"></nav>
  <section class="situation" id="situation" aria-live="polite"></section>
  <section class="teams" id="teams"></section>

  <h2>Standings</h2>
  <div class="tablewrap"><table id="standings"></table></div>

  <details>
    <summary>Rules</summary>
    <ul>
      <li>Offense vs. defense, split and switch.</li>
      <li>+1 point for every base touched.</li>
      <li>−5 points for hitting into a double play.</li>
      <li>−5 points for a base running mistake.</li>
      <li>Exit speed bonus: over 90 is +1, over 95 is +2, over 100 is +3.</li>
    </ul>
  </details>

  <details>
    <summary>Teams, notes and reset</summary>
    <label class="sm">Team names</label>
    <div class="names" id="names"></div>
    <label class="sm" for="notes">Notes</label>
    <textarea id="notes" placeholder="Anything worth remembering from today"></textarea>
    <button class="danger" id="reset">Start a new game</button>
  </details>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const ROUNDS = [
  {desc:"Runner at 1B", bases:[1], outs:1},
  {desc:"Runners at 1B & 2B", bases:[1,2], outs:1},
  {desc:"Runner at 2B", bases:[2], outs:2},
  {desc:"Runners at 1B & 3B", bases:[1,3], outs:1},
  {desc:"Runner at 3B", bases:[3], outs:1},
  {desc:"Bases loaded", bases:[1,2,3], outs:1},
];
const KEY = "point-game-v1";

function blank(){
  return {
    teams:["Alpha","Bravo","Charlie","Delta"],
    round:0,
    scores:ROUNDS.map(()=>[0,1,2,3].map(()=>({b:0,p:0,s:0}))),
    notes:""
  };
}
let state = load();
let history = [];

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const s = JSON.parse(raw); if(s && s.scores && s.teams) return s; }
  }catch(e){}
  return blank();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function snapshot(){ history.push(JSON.stringify(state)); if(history.length>100) history.shift(); }

const pts = c => c.b - 5*c.p + c.s;
const roundTotal = (r,t) => pts(state.scores[r][t]);
const gameTotal = t => state.scores.reduce((a,_,r)=>a+roundTotal(r,t),0);
const esc = s => String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function diamond(on){
  const has = n => on.includes(n) ? " on" : "";
  return `<svg viewBox="0 0 100 100" aria-hidden="true">
    <path d="M50 88 L88 50 L50 12 L12 50 Z" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"/>
    <rect class="base${has(2)}" x="41" y="3" width="18" height="18" transform="rotate(45 50 12)"/>
    <rect class="base${has(1)}" x="79" y="41" width="18" height="18" transform="rotate(45 88 50)"/>
    <rect class="base${has(3)}" x="3" y="41" width="18" height="18" transform="rotate(45 12 50)"/>
    <path d="M42 84 L58 84 L58 92 L50 98 L42 92 Z" fill="#fff"/>
  </svg>`;
}

function renderRounds(){
  document.getElementById("rounds").innerHTML = ROUNDS.map((r,i)=>
    `<button class="rbtn" data-round="${i}" aria-pressed="${i===state.round}" aria-label="Round ${i+1}: ${r.desc}, ${r.outs} out${r.outs>1?'s':''}">
      <b>${i+1}</b><span>${r.bases.length===3?'Loaded':r.bases.map(b=>b+'B').join('·')}</span></button>`).join("");
}
function renderSituation(){
  const r = ROUNDS[state.round];
  document.getElementById("situation").innerHTML = `${diamond(r.bases)}
    <div class="sit-text"><div class="rn">Round ${state.round+1} of 6</div>
    <div class="desc">${r.desc}</div>
    <div class="outs"><span class="dot${r.outs>=1?' on':''}"></span><span class="dot${r.outs>=2?' on':''}"></span>&nbsp;${r.outs} out${r.outs>1?'s':''}</div></div>`;
}
function renderTeams(){
  const r = state.round;
  const totals = state.teams.map((_,t)=>gameTotal(t));
  const max = Math.max(...totals);
  const anyScore = totals.some(v=>v!==0);
  document.getElementById("teams").innerHTML = state.teams.map((name,t)=>{
    const c = state.scores[r][t], rt = pts(c);
    const lead = anyScore && totals[t]===max;
    return `<article class="team" data-team="${t}">
      <div class="team-top">
        <div><div class="tname">${esc(name)}</div>
          <div class="gtot">Game total ${totals[t]}${lead?' <span class="lead">· leading</span>':''}</div></div>
        <div class="rtot"><b class="${rt<0?'neg':''}" id="rt${t}">${rt}</b><span>Round ${r+1}</span></div>
      </div>
      <div class="row"><div class="lbl">Bases touched<span class="sub">+1 each</span></div>
        <div class="stepper"><button data-act="b-" aria-label="Remove a base for ${esc(name)}">−</button><output>${c.b}</output><button class="plus" data-act="b+" aria-label="Add a base for ${esc(name)}">+</button></div></div>
      <div class="row"><div class="lbl">DP / Base Running Mistake<span class="sub">−5 each</span></div>
        <div class="stepper"><button data-act="p-" aria-label="Remove a penalty for ${esc(name)}">−</button><output>${c.p}</output><button class="minus5" data-act="p+" aria-label="Add a penalty for ${esc(name)}">+</button></div></div>
      <div class="row"><div class="lbl">Speed bonus<span class="sub">Points from exit speed</span></div>
        <div class="stepper"><button data-act="s-" aria-label="Remove a bonus point for ${esc(name)}">−</button><output>${c.s}</output><button class="plus" data-act="s+" aria-label="Add a bonus point for ${esc(name)}">+</button></div></div>
      <div class="velo">
        <button data-act="v1" aria-label="Exit speed over 90, plus 1">Over 90<small>+1</small></button>
        <button data-act="v2" aria-label="Exit speed over 95, plus 2">Over 95<small>+2</small></button>
        <button data-act="v3" aria-label="Exit speed over 100, plus 3">Over 100<small>+3</small></button>
      </div>
    </article>`;
  }).join("");
}
function renderStandings(){
  const order = state.teams.map((_,t)=>t).sort((a,b)=>gameTotal(b)-gameTotal(a));
  const max = gameTotal(order[0]);
  const anyScore = state.teams.some((_,t)=>gameTotal(t)!==0);
  let h = `<thead><tr><th>Team</th>${ROUNDS.map((_,i)=>`<th class="${i===state.round?'cur':''}">R${i+1}</th>`).join("")}<th>Total</th></tr></thead><tbody>`;
  order.forEach((t,i)=>{
    const lead = anyScore && gameTotal(t)===max;
    h += `<tr class="${lead?'leader':''}"><td><span class="rank">${i+1}</span>${esc(state.teams[t])}</td>${ROUNDS.map((_,r)=>`<td class="${r===state.round?'cur':''}">${roundTotal(r,t)}</td>`).join("")}<td class="tot">${gameTotal(t)}</td></tr>`;
  });
  document.getElementById("standings").innerHTML = h + "</tbody>";
}
function renderSetup(){
  const box = document.getElementById("names");
  if(!box.dataset.built){
    box.innerHTML = state.teams.map((n,t)=>`<input type="text" data-name="${t}" aria-label="Team ${t+1} name" maxlength="24">`).join("");
    box.dataset.built = "1";
  }
  box.querySelectorAll("input").forEach(inp=>{ if(document.activeElement!==inp) inp.value = state.teams[+inp.dataset.name]; });
  const notes = document.getElementById("notes");
  if(document.activeElement!==notes) notes.value = state.notes || "";
}
function renderUndo(){ document.getElementById("undo").setAttribute("aria-disabled", history.length? "false":"true"); }
function render(){ renderRounds(); renderSituation(); renderTeams(); renderStandings(); renderSetup(); renderUndo(); }

let toastTimer;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove("show"),1400);
}

document.getElementById("rounds").addEventListener("click",e=>{
  const b = e.target.closest("[data-round]"); if(!b) return;
  state.round = +b.dataset.round; save(); render();
});

document.getElementById("teams").addEventListener("click",e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const t = +b.closest("[data-team]").dataset.team;
  const c = state.scores[state.round][t];
  const act = b.dataset.act;
  const name = state.teams[t];
  snapshot();
  let msg = "";
  switch(act){
    case "b+": c.b++; msg = `${name}: +1 base`; break;
    case "b-": if(c.b>0){c.b--; msg=`${name}: base removed`;} break;
    case "p+": c.p++; msg = `${name}: −5 penalty`; break;
    case "p-": if(c.p>0){c.p--; msg=`${name}: penalty removed`;} break;
    case "s+": c.s++; msg = `${name}: +1 bonus`; break;
    case "s-": if(c.s>0){c.s--; msg=`${name}: bonus point removed`;} break;
    case "v1": c.s+=1; msg = `${name}: over 90, +1`; break;
    case "v2": c.s+=2; msg = `${name}: over 95, +2`; break;
    case "v3": c.s+=3; msg = `${name}: over 100, +3`; break;
  }
  if(!msg){ history.pop(); return; }
  save(); render(); toast(msg);
  const rt = document.getElementById("rt"+t); if(rt){ rt.classList.add("bump"); }
});

document.getElementById("undo").addEventListener("click",()=>{
  if(!history.length) return;
  state = JSON.parse(history.pop()); save(); render(); toast("Last change undone");
});

document.getElementById("names").addEventListener("input",e=>{
  const i = e.target.dataset.name; if(i===undefined) return;
  state.teams[+i] = e.target.value.trim() || ["Alpha","Bravo","Charlie","Delta"][+i];
  save(); renderTeams(); renderStandings();
});
document.getElementById("notes").addEventListener("input",e=>{ state.notes = e.target.value; save(); });

document.getElementById("reset").addEventListener("click",()=>{
  if(!confirm("Clear every score and start a new game? Team names stay.")) return;
  snapshot();
  const names = state.teams.slice();
  state = blank(); state.teams = names;
  save(); render(); toast("New game started — Undo brings it back");
});

render();
</script>
</body>
</html>
